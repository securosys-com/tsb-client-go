image: golang:1.27

default:
  tags:
    - Go

variables:
  # Build and test with the minimum Go 1.27 release used by this module.
  GOTOOLCHAIN: go1.27.0

stages:
  - lint
  - test
  - mirror

# https://go.dev/doc/tutorial/govulncheck
# Run via `go run` rather than `go install`: the shell executor's GOPATH/bin is
# not on PATH, and pinning the version keeps the job reproducible.
govulncheck:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
  script:
    # Scan with the latest patched Go 1.27 toolchain.
    - GOTOOLCHAIN=go1.27.1 go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

# https://staticcheck.dev/
staticcheck:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
  script:
    - go run honnef.co/go/tools/cmd/staticcheck@2026.2rc1 $(go list ./...)

# https://github.com/uber-go/nilaway
nil-safety:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
  script:
    # Exclude tests because t.Fatalf() leads to false positives
    - go run go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260803001828-dc48a6814e08 -test=false $(go list ./...)

test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
  script:
    - go test -count=1 -v -timeout 20m ./...

mirror:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  stage: mirror
  script:
    - git fetch --tags origin
    - git remote remove github || true
    - git remote add github "https://x-access-token:${GH_TOKEN}@github.com/securosys-com/tsb-client-go.git"
    - git push github refs/remotes/origin/main:refs/heads/main --force

mirror_tag:
  rules:
    - if: $CI_COMMIT_TAG
  stage: mirror
mirror_tag:
  rules:
    - if: $CI_COMMIT_TAG
  stage: mirror
  script:
    - git fetch --force --tags origin
    - git remote remove github || true
    - git remote add github "https://x-access-token:${GH_TOKEN}@github.com/securosys-com/tsb-client-go.git"
    - git push --force github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"