image: golang:1.25

default:
  tags:
    - Go

stages:
  - lint
  - test
  - mirror

# https://go.dev/doc/tutorial/govulncheck
# Run via `go run` rather than `go install`: the shell executor's GOPATH/bin is
# not on PATH, and pinning the version keeps the job reproducible.
govulncheck:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
  script:
    - go test -count=1 -v -timeout 20m ./...

mirror:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  stage: mirror
  script:
    - git fetch --tags origin
    - git remote remove github || true
    - git remote add github "https://x-access-token:${GH_TOKEN}@github.com/securosys-com/tsb-client-go.git"
    - git push github refs/remotes/origin/main:refs/heads/main --force

mirror_tag:
  rules:
    - if: $CI_COMMIT_TAG
  stage: mirror
  script:
    - git fetch --tags origin
    - git remote remove github || true
    - git remote add github "https://x-access-token:${GH_TOKEN}@github.com/securosys-com/tsb-client-go.git"
    - git push github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
